<!doctype html>
<html lang="en" data-app="morning-report">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title>Morning Report</title>
  <script src="boot.js"></script>
  <script src="/wizard-os-home/core/app-client.js"></script>
  <link rel="stylesheet" href="wizard-ui.css">
  <link rel="stylesheet" href="wizard-layout.css">
  <link rel="stylesheet" href="styles.css">
  <script defer src="theme-client.js"></script>
  <script defer src="cards.js"></script>
  <script defer src="markdown.js"></script>
  <script defer src="reply.js"></script>
  <script defer src="routes.js"></script>
  <script defer src="app.js"></script>
  <script defer src="wizard-sheet.js"></script>
</head>
<body>
  <div class="wz-app mr-app">
    <header class="wz-head"><h1>Morning Report</h1><p id="count"></p></header>
    <nav class="wz-bar mr-day" aria-label="Report day" hidden>
      <span class="mr-nav">
        <button id="older" class="wz-icon-button mr-step" type="button" aria-label="Earlier day" title="Earlier day" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg>
        </button>
        <label class="mr-pick"><span class="wz-sr">Report day</span>
          <select id="pick" aria-label="Report day"></select>
        </label>
        <button id="newer" class="wz-icon-button mr-step" type="button" aria-label="Later day" title="Later day" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg>
        </button>
      </span>
      <span class="mr-tools">
      <button id="read-top" class="wz-button mr-read" type="button" aria-label="Mark as read" title="Mark as read" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg><span class="mr-read-label">Mark as read</span></button>
      <a id="pdf" class="wz-button secondary mr-pdf" href="#" target="_blank" rel="noopener" hidden>PDF</a>
      </span>
    </nav>
    <main class="wz-scroll mr-scroll">
      <article id="paper" class="mr-paper" aria-live="polite"></article>
      <div class="mr-end"><button id="read-end" class="wz-button mr-read" type="button" hidden>Mark as read</button></div>
      <div id="empty" class="wz-empty" hidden>
        <div class="wz-tile" aria-hidden="true">☀</div>
        <strong>No reports yet</strong>
        <p>Your first report appears here after the next morning run.</p>
      </div>
    </main>
    <div class="mr-reply"><button id="reply" class="mr-btn mr-text" type="button" aria-label="Reply to selected report text in Chats" hidden>Reply</button></div>
    <p id="status" class="wz-status" role="status" aria-live="polite"></p>
  </div>
</body>
</html>
